{% extends "base.html" %}
{% block title %}Detalle de producto{% endblock %}
{% set active_page = "products" %}

{% block content %}
<div class="page-header-row">
  <a href="{{ root_path }}/products" class="btn btn-ghost btn-icon btn-sm" title="Volver a productos">
    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
  </a>
  <h1 id="product-title" class="page-header-title">Cargando...</h1>
</div>

<div id="product-detail-content">
  <div class="loading-overlay">
    <div class="spinner"></div>
    <span>Cargando producto...</span>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ root_path }}/static/vendor/jsbarcode/jsbarcode.all.min.js"></script>
<script>
(function() {
  if (!Auth.requireAuth()) return;

  const pathParts = window.location.pathname.split('/');
  // Pattern: /label/products/{id}
  const productsIdx = pathParts.findIndex(p => p === 'products');
  const productId   = productsIdx >= 0 ? pathParts[productsIdx + 1] : null;

  if (!productId || productId === 'new' || productId === 'edit') {
    window.location.href = ROOT + '/products';
    return;
  }

  const container = document.getElementById('product-detail-content');

  function translateField(key) {
    const map = {
      // Energia y macros
      energy_kj: 'Energia (kJ)',
      energy_kcal: 'Energia (kcal)',
      fat_g: 'Grasas (g)',
      fat: 'Grasas (g)',
      saturated_fat_g: 'Acidos grasos saturados (g)',
      saturated_fat: 'Acidos grasos saturados (g)',
      carbohydrates_g: 'Hidratos de carbono (g)',
      carbohydrates: 'Hidratos de carbono (g)',
      sugars_g: 'Azucares (g)',
      sugars: 'Azucares (g)',
      protein_g: 'Proteinas (g)',
      proteins: 'Proteinas (g)',
      protein: 'Proteinas (g)',
      salt_g: 'Sal (g)',
      salt: 'Sal (g)',
      fiber_g: 'Fibra alimentaria (g)',
      fiber: 'Fibra alimentaria (g)',
      // Informacion del producto
      net_weight: 'Peso neto',
      net_weight_unit: 'Unidad de peso',
      serving_size: 'Tamano de porcion',
      servings: 'Porciones por envase',
      servings_per_container: 'Porciones por envase',
      ingredients: 'Ingredientes',
      allergens: 'Alergenos',
      may_contain: 'Puede contener',
      // Fechas y conservacion
      storage_conditions: 'Condiciones de almacenamiento',
      best_before: 'Consumir preferentemente antes de',
      use_by: 'Fecha de caducidad',
      // Origen y fabricante
      country_of_origin: 'Pais de origen',
      manufacturer: 'Fabricante',
      manufacturer_address: 'Direccion del fabricante',
      producer_name: 'Nombre del productor',
      producer_address: 'Direccion del productor',
      distributor: 'Distribuidor',
      // Cosmeticos
      volume_ml: 'Volumen (ml)',
      weight_g: 'Peso (g)',
      inci_list: 'Lista INCI',
      warnings: 'Advertencias',
      usage_instructions: 'Instrucciones de uso',
      // Otros
      batch_number: 'Numero de lote',
      certifications: 'Certificaciones',
      traces: 'Trazas',
      sodium_mg: 'Sodio (mg)',
      vitamin_c_mg: 'Vitamina C (mg)',
      calcium_mg: 'Calcio (mg)',
      iron_mg: 'Hierro (mg)',
    };
    return map[key] || key.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
  }

  async function loadProduct() {
    try {
      const [product, labelsData] = await Promise.all([
        api.get(`/api/v1/products/${productId}`),
        api.get(`/api/v1/products/${productId}/labels?page=1&page_size=10`).catch(() => null),
      ]);

      document.getElementById('product-title').textContent = product.name;

      const labels = labelsData?.items || [];

      const hasRegData = product.regulatory_data && Object.keys(product.regulatory_data).length > 0;
      container.innerHTML = `
        ${renderScoreBadges(product)}
        <div id="off-enriched"></div>
        ${hasRegData
          ? `<div class="product-main-grid">
              ${renderInfoCard(product)}
              ${renderRegulatoryData(product.regulatory_data)}
             </div>`
          : renderInfoCard(product)
        }
        ${renderPackaging(product)}
        <div id="market-price-block"></div>
        ${renderActionsCard(product)}
        ${renderLabelsCard(labels, labelsData)}
      `;

      // Lightbox handler
      container.querySelectorAll('.product-gallery-thumb').forEach(function(img) {
        img.addEventListener('click', function() {
          var src = this.getAttribute('data-full') || this.src;
          var lb = document.createElement('div');
          lb.className = 'gallery-lightbox';
          lb.innerHTML = '<img src="' + escHtml(src) + '" alt="Foto del producto">';
          lb.addEventListener('click', function() { lb.remove(); });
          document.body.appendChild(lb);
        });
      });

      // Enrich with OFF data if product has barcode (traces, additives, packaging, photos, category)
      if (product.barcode) {
        enrichFromOFF(product.barcode, product);
      }

      // Load market price asynchronously
      loadMarketPrice(productId);

      // Render barcode SVG if product has barcode
      if (product.barcode && typeof JsBarcode !== 'undefined') {
        const svgEl = document.getElementById('barcode-svg');
        const wrap  = document.getElementById('barcode-wrap');
        if (svgEl && wrap) {
          const formats = product.barcode.length === 8 ? ['EAN8', 'CODE128']
                        : product.barcode.length === 13 ? ['EAN13', 'CODE128']
                        : ['CODE128'];
          let rendered = false;
          for (const fmt of formats) {
            try {
              JsBarcode(svgEl, product.barcode, {
                format: fmt, width: 2.4, height: 72,
                fontSize: 13, margin: 6,
                lineColor: '#1a2332', background: 'transparent',
              });
              rendered = true;
              break;
            } catch(e) { /* try next format */ }
          }
          if (rendered) wrap.style.display = 'flex';
        }
      }

      // Check api_offer for active offers matching this barcode
      if (product.barcode) checkOffersAsync(product.barcode);

      // Generate label button
      document.getElementById('btn-gen-label').addEventListener('click', () => showGenerateModal(product));

      // Delete button
      document.getElementById('btn-delete').addEventListener('click', async () => {
        if (!confirm('\u00bfEliminar el producto "' + product.name + '"? Esta accion no se puede deshacer.')) return;
        try {
          await api.del('/api/v1/products/' + productId);
          Toast.success('Producto eliminado');
          setTimeout(function() { window.location.href = ROOT + '/products'; }, 800);
        } catch(e) {
          Toast.error(e.message || 'Error al eliminar');
        }
      });

    } catch(e) {
      container.innerHTML = '<div class="alert alert-error">' + (e.message || 'Error cargando el producto') + '</div>';
    }
  }

  function escHtml(str) {
    if (!str) return '';
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function renderScoreBadges(product) {
    var nsColors = {a:'#038141',b:'#85BB2F',c:'#FECB02',d:'#EE8100',e:'#E63E11'};
    var novaColors = {1:'#038141',2:'#85BB2F',3:'#EE8100',4:'#E63E11'};
    var novaLabels = {1:'Sin procesar',2:'Procesado basico',3:'Procesado',4:'Ultraprocesado'};
    var letters = ['a','b','c','d','e'];

    var hasScores = product.nutriscore || product.nova_group || product.ecoscore;
    var hasAnalysis = product.is_vegan !== null || product.is_vegetarian !== null || product.is_palm_oil_free !== null;
    if (!hasScores && !hasAnalysis) return '';

    var html = '';

    // Score badges row
    if (hasScores) {
      html += '<div class="score-badges">';

      // NutriScore bar
      if (product.nutriscore) {
        html += '<div style="text-align:center"><div style="font-size:0.65rem;font-weight:600;color:var(--text-muted);margin-bottom:3px;text-transform:uppercase;letter-spacing:0.05em">NutriScore</div><div class="ns-bar">';
        for (var i = 0; i < letters.length; i++) {
          var l = letters[i];
          var isActive = product.nutriscore.toLowerCase() === l;
          html += '<div class="ns-bar-item' + (isActive ? ' active' : '') + '" style="background:' + nsColors[l] + '">' + l.toUpperCase() + '</div>';
        }
        html += '</div></div>';
      }

      // NOVA badge
      if (product.nova_group) {
        var ng = product.nova_group;
        html += '<div style="text-align:center"><div style="font-size:0.65rem;font-weight:600;color:var(--text-muted);margin-bottom:3px;text-transform:uppercase;letter-spacing:0.05em">NOVA</div><div class="nova-badge"><div class="nova-circle" style="background:' + (novaColors[ng] || '#999') + '">' + ng + '</div><div class="nova-label">' + (novaLabels[ng] || '') + '</div></div></div>';
      }

      // Eco-Score bar
      if (product.ecoscore) {
        html += '<div style="text-align:center"><div style="font-size:0.65rem;font-weight:600;color:var(--text-muted);margin-bottom:3px;text-transform:uppercase;letter-spacing:0.05em">Eco-Score</div><div class="eco-bar">';
        for (var j = 0; j < letters.length; j++) {
          var el = letters[j];
          var isActiveE = product.ecoscore.toLowerCase() === el;
          html += '<div class="eco-bar-item' + (isActiveE ? ' active' : '') + '" style="background:' + nsColors[el] + '">' + el.toUpperCase() + '</div>';
        }
        html += '</div></div>';
      }

      html += '</div>';
    }

    // Ingredient analysis pills
    if (hasAnalysis) {
      html += '<div class="analysis-pills">';
      if (product.is_vegan === true) {
        html += '<span class="analysis-pill analysis-pill-true">Vegano</span>';
      } else if (product.is_vegan === false) {
        html += '<span class="analysis-pill analysis-pill-false">No vegano</span>';
      }
      if (product.is_vegetarian === true) {
        html += '<span class="analysis-pill analysis-pill-true">Vegetariano</span>';
      } else if (product.is_vegetarian === false) {
        html += '<span class="analysis-pill analysis-pill-false">No vegetariano</span>';
      }
      if (product.is_palm_oil_free === true) {
        html += '<span class="analysis-pill analysis-pill-true">Sin aceite de palma</span>';
      } else if (product.is_palm_oil_free === false) {
        html += '<span class="analysis-pill analysis-pill-false">Contiene aceite de palma</span>';
      }
      html += '</div>';
    }

    return html;
  }

  function renderTracesAdditives(product) {
    var regData = product.regulatory_data || {};
    var allergens = regData.allergens || null;
    var traces = regData.traces || null;
    var additives = product.additives || (regData.additives || null);
    var addCount = product.additives_count;
    if (addCount == null && additives) {
      addCount = additives.split(',').length;
    }

    if (!allergens && !traces && additives == null) return '';

    var html = '<div class="card mb-4"><div class="card-title">Alergenos, trazas y aditivos</div>';

    if (allergens) {
      html += '<div class="trace-row"><span class="trace-icon">&#9888;&#65039;</span><span class="trace-label">Alergenos:</span> <span class="trace-value">' + escHtml(allergens) + '</span></div>';
    }

    if (traces) {
      html += '<div class="trace-row"><span class="trace-icon">&#9888;</span><span class="trace-label">Trazas:</span> <span class="trace-value">puede contener ' + escHtml(traces) + '</span></div>';
    }

    if (additives != null) {
      var addLevel, addColor, addText;
      var count = addCount || 0;
      if (count === 0) {
        addColor = '#16a34a'; addText = 'Sin aditivos';
      } else if (count <= 3) {
        addColor = '#16a34a'; addText = 'Pocos aditivos';
      } else if (count <= 7) {
        addColor = '#ca8a04'; addText = 'Aditivos moderados';
      } else {
        addColor = '#dc2626'; addText = 'Muchos aditivos';
      }
      html += '<div class="trace-row"><span class="trace-icon" style="font-size:0.9rem">&#129514;</span><span class="trace-label">Aditivos';
      if (count > 0) html += ' (' + count + ')';
      html += ':</span> <span class="additive-badge" style="background:' + addColor + '">' + escHtml(addText) + '</span>';
      if (additives && count > 0) {
        html += '<div class="trace-detail">' + escHtml(additives) + '</div>';
      }
      html += '</div>';
    }

    html += '</div>';
    return html;
  }

  function renderCategoryComparison(product) {
    var cat = product.compared_to_category || product.categories || null;
    var novaLabelsMap = {1:'Sin procesar',2:'Procesado basico',3:'Procesado',4:'Ultraprocesado'};
    if (!cat && !product.nova_group) return '';

    var html = '<div class="card mb-4"><div class="card-title">Categoria y procesamiento</div>';
    html += '<div class="cat-compare-grid">';
    if (cat) {
      var displayCat = product.compared_to_category || cat;
      html += '<div class="cat-compare-item"><span class="detail-label">Categoria</span><span class="detail-value">' + escHtml(displayCat) + '</span></div>';
    }
    if (product.nova_group) {
      html += '<div class="cat-compare-item"><span class="detail-label">Procesamiento NOVA</span><span class="detail-value">' + product.nova_group + ' - ' + (novaLabelsMap[product.nova_group] || '') + '</span></div>';
    }
    html += '</div></div>';
    return html;
  }

  function renderPhotoGallery(product) {
    var photos = [];
    var seen = new Set();
    if (product.image_url) { seen.add(product.image_url); photos.push({thumb: product.image_url, full: product.image_url, label: 'Producto'}); }
    if (product.image_nutrition_url && !seen.has(product.image_nutrition_url)) { seen.add(product.image_nutrition_url); photos.push({thumb: product.image_nutrition_url, full: product.image_nutrition_url, label: 'Tabla nutricional'}); }
    if (product.image_ingredients_url && !seen.has(product.image_ingredients_url)) { seen.add(product.image_ingredients_url); photos.push({thumb: product.image_ingredients_url, full: product.image_ingredients_url, label: 'Ingredientes'}); }
    if (photos.length === 0) return '';

    var html = '<div class="card mb-4"><div class="card-title">Fotos del producto</div><div class="product-gallery">';
    for (var i = 0; i < photos.length; i++) {
      var p = photos[i];
      html += '<div style="text-align:center"><img class="product-gallery-thumb" src="' + escHtml(p.thumb) + '" alt="' + escHtml(p.label) + '" data-full="' + escHtml(p.full) + '" onerror="this.parentElement.style.display=\'none\'"><div style="font-size:0.7rem;color:var(--text-muted);margin-top:2px">' + escHtml(p.label) + '</div></div>';
    }
    html += '</div></div>';
    return html;
  }

  function renderPackaging(product) {
    var pkg = product.packaging || null;
    if (!pkg) return '';
    return '<div class="packaging-row"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="flex-shrink:0"><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/></svg><span style="font-size:0.82rem"><strong>Envase:</strong> ' + escHtml(pkg) + '</span></div>';
  }

  function renderInfoCard(product) {
    return `
      <div class="card">
        <div class="card-title">Informacion general</div>
        <div class="flex flex-wrap gap-4" style="align-items:flex-start">
          ${product.image_url ? `<img src="${escHtml(product.image_url)}" alt="${escHtml(product.name)}" style="width:80px;height:80px;object-fit:cover;border-radius:var(--radius-sm);flex-shrink:0" onerror="this.style.display='none'">` : ''}
          <div style="flex:1;min-width:0">
            <div class="flex flex-wrap gap-2 mb-2">
              <span class="badge ${product.is_active ? 'badge-success' : 'badge-neutral'}">${product.is_active ? 'Activo' : 'Inactivo'}</span>
            </div>
            <div class="detail-fields">
              ${product.brand ? `<div class="detail-field"><span class="detail-label">Marca</span><span class="detail-value">${escHtml(product.brand)}</span></div>` : ''}
              ${product.barcode ? `<div class="detail-field"><span class="detail-label">Codigo de barras</span><span class="detail-value mono">${escHtml(product.barcode)}</span></div>` : ''}
              <div id="offer-btn-wrap" style="display:none;grid-column:1/-1;margin-top:0.25rem"></div>
              ${product.category_name ? `<div class="detail-field"><span class="detail-label">Categoria</span><span class="detail-value">${escHtml(product.category_name)}</span></div>` : ''}
            </div>
            ${product.description ? `<div style="margin-top:0.75rem;font-size:0.875rem;color:var(--text-muted)">${escHtml(product.description)}</div>` : ''}
          </div>
        </div>
        ${product.barcode ? `<div class="barcode-wrap" id="barcode-wrap" style="display:none"><svg id="barcode-svg"></svg></div>` : ''}
      </div>`;
  }

  function renderRegulatoryData(data) {
    if (!data || Object.keys(data).length === 0) return '';
    return `
      <div class="card">
        <div class="card-title">Datos regulatorios</div>
        <div class="reg-data-list">
          ${Object.entries(data).map(([k, v]) => `
            <div class="reg-row">
              <span class="detail-label">${translateField(k)}</span>
              <span class="detail-value reg-val">${escHtml(Array.isArray(v) ? v.join(', ') : String(v))}</span>
            </div>`).join('')}
        </div>
      </div>`;
  }

  function renderActionsCard(product) {
    return `
      <div class="card mb-4">
        <div class="card-title">Acciones</div>
        <div class="flex flex-wrap gap-2">
          <button class="btn btn-primary" id="btn-gen-label">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            Nueva etiqueta
          </button>
          <a href="${ROOT}/products/${productId}/edit" class="btn btn-outline btn-sm">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            Editar
          </a>
          <button class="btn btn-danger btn-sm" id="btn-delete">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2"/></svg>
            Eliminar
          </button>
        </div>
      </div>`;
  }

  function renderLabelsCard(labels, labelsData) {
    return `
      <div class="card">
        <div class="flex items-center justify-between mb-3">
          <div class="card-title" style="margin-bottom:0">Etiquetas generadas</div>
          <span class="badge badge-neutral">${labelsData?.total || 0}</span>
        </div>
        ${labels.length === 0
          ? `<div class="empty-state" style="padding:1.5rem">
              <div class="empty-state-title">Sin etiquetas</div>
              <div class="empty-state-desc">Genera la primera etiqueta para este producto</div>
            </div>`
          : `<div class="flex flex-col gap-2">${labels.map(l => `
              <div style="display:flex;align-items:center;gap:0.75rem;padding:0.75rem;background:var(--bg);border-radius:var(--radius-sm)">
                <div style="flex:1">
                  <div style="font-weight:600;font-size:0.85rem">
                    ${l.language.toUpperCase()} — ${l.format.toUpperCase()}
                  </div>
                  <div class="text-xs text-muted">${fmtDatetime(l.generated_at)}${l.regulation_version ? ' &bull; Reg. ' + l.regulation_version : ''}</div>
                </div>
                <a href="${ROOT}/labels/${l.id}" class="btn btn-ghost btn-sm">Ver</a>
              </div>`).join('')}
            </div>`}
      </div>`;
  }

  async function checkOffersAsync(barcode) {
    try {
      const result = await api.get('/api/v1/integrations/offers?barcode=' + encodeURIComponent(barcode));
      if (result && result.has_offers && result.url) {
        const wrap = document.getElementById('offer-btn-wrap');
        if (wrap) {
          wrap.innerHTML = `<a href="${escHtml(result.url)}" target="_blank" rel="noopener noreferrer" class="btn btn-accent btn-sm">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20.59 13.41l-7.17 7.17a2 2 0 01-2.83 0L2 12V2h10l8.59 8.59a2 2 0 010 2.82z"/><circle cx="7" cy="7" r="1.5" fill="currentColor"/></svg>
            Ver oferta
          </a>`;
          wrap.style.display = 'block';
        }
      }
    } catch(e) { /* fail silently — api_offer may be down */ }
  }

  async function showGenerateModal(product) {
    const lang = confirm('\u00bfGenerar en espanol? (Cancelar para ingles)') ? 'es' : 'en';
    const format = confirm('\u00bfGenerar en formato HTML? (Cancelar para PDF)') ? 'html' : 'pdf';
    try {
      Toast.info('Generando etiqueta...');
      const label = await api.post('/api/v1/labels/generate', {
        product_id: product.id,
        format,
        language: lang,
      });
      Toast.success('Etiqueta generada');
      window.location.href = ROOT + '/labels/' + label.id;
    } catch(e) {
      Toast.error(e.message || 'Error generando etiqueta');
    }
  }

  function fmtEur(v) {
    if (v == null) return '—';
    return new Intl.NumberFormat('es-ES', { style: 'currency', currency: 'EUR', minimumFractionDigits: 2 }).format(v);
  }

  function fuenteLabel(fuente) {
    const map = { mercadona:'Mercadona', carrefour:'Carrefour', alimerka:'Alimerka', masymas:'Masymas', aldi:'Aldi', alcampo:'Alcampo', familia:'Familia', gadis:'Gadis', gadisline:'Gadis' };
    const lower = (fuente || '').toLowerCase();
    if (lower.startsWith('folleto:')) return 'Folleto ' + (map[lower.slice(8)] || lower.slice(8));
    for (const [k, n] of Object.entries(map)) { if (lower.includes(k)) return n; }
    return fuente || '';
  }

  async function loadMarketPrice(productId) {
    const block = document.getElementById('market-price-block');
    if (!block) return;
    try {
      const data = await api.get(`/api/v1/products/${productId}/market-price`);
      if (!data.found) return;

      const nsColors = {a:'#038141',b:'#85BB2F',c:'#FECB02',d:'#EE8100',e:'#E63E11'};
      let offersHtml = '';
      for (const o of (data.offers || [])) {
        const nsBg = nsColors[o.nutriscore] || '#999';
        const nsHtml = o.nutriscore
          ? `<span style="display:inline-flex;width:20px;height:20px;border-radius:4px;align-items:center;justify-content:center;font-size:0.65rem;font-weight:700;color:#fff;background:${nsBg}">${o.nutriscore.toUpperCase()}</span>`
          : '';
        const discHtml = o.descuento_porcentaje ? `<span style="color:var(--accent);font-size:0.75rem">-${Math.round(o.descuento_porcentaje)}%</span>` : '';
        const linkHtml = o.producto_url ? `<a href="${escHtml(o.producto_url)}" target="_blank" rel="noopener" style="font-size:0.75rem;color:var(--primary)">Ver</a>` : '';
        offersHtml += `<tr>
          <td style="font-size:0.85rem">${escHtml(fuenteLabel(o.fuente))} ${nsHtml}</td>
          <td style="font-weight:600">${fmtEur(o.precio_oferta)}</td>
          <td>${discHtml}</td>
          <td>${linkHtml}</td>
        </tr>`;
      }

      block.innerHTML = `
        <div class="card mb-4">
          <div class="card-title" style="display:flex;align-items:center;gap:0.5rem">
            <svg width="18" height="18" fill="none" stroke="var(--primary)" stroke-width="2" viewBox="0 0 24 24"><path d="M20.59 13.41l-7.17 7.17a2 2 0 01-2.83 0L2 12V2h10l8.59 8.59a2 2 0 010 2.82z"/><circle cx="7" cy="7" r="1.5" fill="var(--primary)"/></svg>
            Precio de mercado
          </div>
          <div style="display:flex;gap:1.5rem;flex-wrap:wrap;margin-bottom:1rem">
            <div style="text-align:center">
              <div style="font-size:1.6rem;font-weight:700;color:var(--primary)">${fmtEur(data.avg_price)}</div>
              <div style="font-size:0.75rem;color:var(--text-muted)">Precio medio</div>
            </div>
            <div style="text-align:center">
              <div style="font-size:1.1rem;font-weight:600;color:#16a34a">${fmtEur(data.min_price)}</div>
              <div style="font-size:0.75rem;color:var(--text-muted)">Mejor precio</div>
            </div>
            <div style="text-align:center">
              <div style="font-size:1.1rem;font-weight:600;color:var(--text-muted)">${fmtEur(data.max_price)}</div>
              <div style="font-size:0.75rem;color:var(--text-muted)">Precio máximo</div>
            </div>
            <div style="text-align:center">
              <div style="font-size:1.1rem;font-weight:600">${data.supermarkets}</div>
              <div style="font-size:0.75rem;color:var(--text-muted)">Supermercados</div>
            </div>
          </div>
          <div style="overflow-x:auto">
            <table style="width:100%;font-size:0.85rem;border-collapse:collapse">
              <thead><tr style="border-bottom:2px solid var(--border)">
                <th style="text-align:left;padding:0.4rem 0.5rem">Supermercado</th>
                <th style="text-align:left;padding:0.4rem 0.5rem">Precio</th>
                <th style="text-align:left;padding:0.4rem 0.5rem">Dto.</th>
                <th style="padding:0.4rem 0.5rem"></th>
              </tr></thead>
              <tbody>${offersHtml}</tbody>
            </table>
          </div>
          <div style="margin-top:0.75rem;text-align:center">
            <a href="https://raquel.pibico.es/offer/comparar" target="_blank" rel="noopener" class="btn btn-ghost btn-sm">Ver en Ofertas PiBiCo →</a>
          </div>
        </div>`;
    } catch(e) { /* fail silently */ }
  }

  async function enrichFromOFF(barcode, product) {
    try {
      var resp = await fetch(ROOT + '/api/v1/off/barcode-search/' + encodeURIComponent(barcode), { credentials: 'include' });
      if (!resp.ok) return;
      var off = await resp.json();

      // Update sections that depend on OFF-only data
      var needsRerender = false;

      // Traces & additives
      if (off.traces || off.additives) {
        product.traces = off.traces;
        product.additives = off.additives;
        product.additives_count = off.additives_count;
        if (off.traces && product.regulatory_data) product.regulatory_data.traces = off.traces;
        needsRerender = true;
      }

      // Category comparison
      if (off.compared_to_category) {
        product.compared_to_category = off.compared_to_category;
        needsRerender = true;
      }

      // Extra images (only if not already on product)
      if (off.image_nutrition_url && !product.image_nutrition_url) {
        product.image_nutrition_url = off.image_nutrition_url;
        needsRerender = true;
      }
      if (off.image_ingredients_url && !product.image_ingredients_url) {
        product.image_ingredients_url = off.image_ingredients_url;
        needsRerender = true;
      }

      // Packaging
      if (off.packaging) {
        product.packaging = off.packaging;
        needsRerender = true;
      }

      // Render enriched sections into the placeholder (traces, category, photos, packaging)
      var wrapper = document.getElementById('off-enriched');
      if (wrapper) {
        wrapper.innerHTML = renderTracesAdditives(product) + renderCategoryComparison(product) + renderPhotoGallery(product) + renderPackaging(product);

        // Bind lightbox to gallery thumbnails
        wrapper.querySelectorAll('.product-gallery-thumb').forEach(function(img) {
          img.addEventListener('click', function() {
            var src = this.getAttribute('data-full') || this.src;
            var lb = document.createElement('div');
            lb.className = 'gallery-lightbox';
            lb.innerHTML = '<img src="' + escHtml(src) + '" alt="Foto del producto">';
            lb.addEventListener('click', function() { lb.remove(); });
            document.body.appendChild(lb);
          });
        });
      }
    } catch(e) { /* fail silently — OFF may be slow or down */ }
  }

  loadProduct();
})();
</script>
