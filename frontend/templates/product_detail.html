{% extends "base.html" %}
{% block title %}Detalle de producto{% endblock %}
{% set active_page = "products" %}

{% block content %}
<div class="page-header-row">
  <a href="{{ root_path }}/products" class="btn btn-ghost btn-icon btn-sm" title="Volver a productos">
    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
  </a>
  <h1 id="product-title" class="page-header-title">Cargando...</h1>
</div>

<div id="product-detail-content">
  <div class="loading-overlay">
    <div class="spinner"></div>
    <span>Cargando producto...</span>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ root_path }}/static/vendor/jsbarcode/jsbarcode.all.min.js"></script>
<script>
(function() {
  if (!Auth.requireAuth()) return;

  const pathParts = window.location.pathname.split('/');
  // Pattern: /label/products/{id}
  const productsIdx = pathParts.findIndex(p => p === 'products');
  const productId   = productsIdx >= 0 ? pathParts[productsIdx + 1] : null;

  if (!productId || productId === 'new' || productId === 'edit') {
    window.location.href = ROOT + '/products';
    return;
  }

  const container = document.getElementById('product-detail-content');

  function translateField(key) {
    const map = {
      // Energia y macros
      energy_kj: 'Energia (kJ)',
      energy_kcal: 'Energia (kcal)',
      fat_g: 'Grasas (g)',
      fat: 'Grasas (g)',
      saturated_fat_g: 'Acidos grasos saturados (g)',
      saturated_fat: 'Acidos grasos saturados (g)',
      carbohydrates_g: 'Hidratos de carbono (g)',
      carbohydrates: 'Hidratos de carbono (g)',
      sugars_g: 'Azucares (g)',
      sugars: 'Azucares (g)',
      protein_g: 'Proteinas (g)',
      proteins: 'Proteinas (g)',
      protein: 'Proteinas (g)',
      salt_g: 'Sal (g)',
      salt: 'Sal (g)',
      fiber_g: 'Fibra alimentaria (g)',
      fiber: 'Fibra alimentaria (g)',
      // Informacion del producto
      net_weight: 'Peso neto',
      net_weight_unit: 'Unidad de peso',
      serving_size: 'Tamano de porcion',
      servings: 'Porciones por envase',
      servings_per_container: 'Porciones por envase',
      ingredients: 'Ingredientes',
      allergens: 'Alergenos',
      may_contain: 'Puede contener',
      // Fechas y conservacion
      storage_conditions: 'Condiciones de almacenamiento',
      best_before: 'Consumir preferentemente antes de',
      use_by: 'Fecha de caducidad',
      // Origen y fabricante
      country_of_origin: 'Pais de origen',
      manufacturer: 'Fabricante',
      manufacturer_address: 'Direccion del fabricante',
      producer_name: 'Nombre del productor',
      producer_address: 'Direccion del productor',
      distributor: 'Distribuidor',
      // Cosmeticos
      volume_ml: 'Volumen (ml)',
      weight_g: 'Peso (g)',
      inci_list: 'Lista INCI',
      warnings: 'Advertencias',
      usage_instructions: 'Instrucciones de uso',
      // Otros
      batch_number: 'Numero de lote',
      certifications: 'Certificaciones',
    };
    return map[key] || key.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
  }

  async function loadProduct() {
    try {
      const [product, labelsData] = await Promise.all([
        api.get(`/api/v1/products/${productId}`),
        api.get(`/api/v1/products/${productId}/labels?page=1&page_size=10`).catch(() => null),
      ]);

      document.getElementById('product-title').textContent = product.name;

      const labels = labelsData?.items || [];

      const hasRegData = product.regulatory_data && Object.keys(product.regulatory_data).length > 0;
      container.innerHTML = `
        ${hasRegData
          ? `<div class="product-main-grid">
              ${renderInfoCard(product)}
              ${renderRegulatoryData(product.regulatory_data)}
             </div>`
          : renderInfoCard(product)
        }
        ${renderActionsCard(product)}
        ${renderLabelsCard(labels, labelsData)}
      `;

      // Render barcode SVG if product has barcode
      if (product.barcode && typeof JsBarcode !== 'undefined') {
        const svgEl = document.getElementById('barcode-svg');
        const wrap  = document.getElementById('barcode-wrap');
        if (svgEl && wrap) {
          const formats = product.barcode.length === 8 ? ['EAN8', 'CODE128']
                        : product.barcode.length === 13 ? ['EAN13', 'CODE128']
                        : ['CODE128'];
          let rendered = false;
          for (const fmt of formats) {
            try {
              JsBarcode(svgEl, product.barcode, {
                format: fmt, width: 2.4, height: 72,
                fontSize: 13, margin: 6,
                lineColor: '#1a2332', background: 'transparent',
              });
              rendered = true;
              break;
            } catch(e) { /* try next format */ }
          }
          if (rendered) wrap.style.display = 'flex';
        }
      }

      // Check api_offer for active offers matching this barcode
      if (product.barcode) checkOffersAsync(product.barcode);

      // Generate label button
      document.getElementById('btn-gen-label').addEventListener('click', () => showGenerateModal(product));

      // Delete button
      document.getElementById('btn-delete').addEventListener('click', async () => {
        if (!confirm('\u00bfEliminar el producto "' + product.name + '"? Esta accion no se puede deshacer.')) return;
        try {
          await api.del('/api/v1/products/' + productId);
          Toast.success('Producto eliminado');
          setTimeout(function() { window.location.href = ROOT + '/products'; }, 800);
        } catch(e) {
          Toast.error(e.message || 'Error al eliminar');
        }
      });

    } catch(e) {
      container.innerHTML = '<div class="alert alert-error">' + (e.message || 'Error cargando el producto') + '</div>';
    }
  }

  function escHtml(str) {
    if (!str) return '';
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function renderInfoCard(product) {
    return `
      <div class="card">
        <div class="card-title">Informacion general</div>
        <div class="flex flex-wrap gap-4" style="align-items:flex-start">
          ${product.image_url ? `<img src="${escHtml(product.image_url)}" alt="${escHtml(product.name)}" style="width:80px;height:80px;object-fit:cover;border-radius:var(--radius-sm);flex-shrink:0" onerror="this.style.display='none'">` : ''}
          <div style="flex:1;min-width:0">
            <div class="flex flex-wrap gap-2 mb-2">
              <span class="badge ${product.is_active ? 'badge-success' : 'badge-neutral'}">${product.is_active ? 'Activo' : 'Inactivo'}</span>
            </div>
            <div class="detail-fields">
              ${product.brand ? `<div class="detail-field"><span class="detail-label">Marca</span><span class="detail-value">${escHtml(product.brand)}</span></div>` : ''}
              ${product.barcode ? `<div class="detail-field"><span class="detail-label">Codigo de barras</span><span class="detail-value mono">${escHtml(product.barcode)}</span></div>` : ''}
              <div id="offer-btn-wrap" style="display:none;grid-column:1/-1;margin-top:0.25rem"></div>
              ${product.category_name ? `<div class="detail-field"><span class="detail-label">Categoria</span><span class="detail-value">${escHtml(product.category_name)}</span></div>` : ''}
            </div>
            ${product.description ? `<div style="margin-top:0.75rem;font-size:0.875rem;color:var(--text-muted)">${escHtml(product.description)}</div>` : ''}
          </div>
        </div>
        ${product.barcode ? `<div class="barcode-wrap" id="barcode-wrap" style="display:none"><svg id="barcode-svg"></svg></div>` : ''}
      </div>`;
  }

  function renderRegulatoryData(data) {
    if (!data || Object.keys(data).length === 0) return '';
    return `
      <div class="card">
        <div class="card-title">Datos regulatorios</div>
        <div class="reg-data-list">
          ${Object.entries(data).map(([k, v]) => `
            <div class="reg-row">
              <span class="detail-label">${translateField(k)}</span>
              <span class="detail-value reg-val">${escHtml(Array.isArray(v) ? v.join(', ') : String(v))}</span>
            </div>`).join('')}
        </div>
      </div>`;
  }

  function renderActionsCard(product) {
    return `
      <div class="card mb-4">
        <div class="card-title">Acciones</div>
        <div class="flex flex-wrap gap-2">
          <button class="btn btn-primary" id="btn-gen-label">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            Nueva etiqueta
          </button>
          <a href="${ROOT}/products/${productId}/edit" class="btn btn-outline btn-sm">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            Editar
          </a>
          <button class="btn btn-danger btn-sm" id="btn-delete">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2"/></svg>
            Eliminar
          </button>
        </div>
      </div>`;
  }

  function renderLabelsCard(labels, labelsData) {
    return `
      <div class="card">
        <div class="flex items-center justify-between mb-3">
          <div class="card-title" style="margin-bottom:0">Etiquetas generadas</div>
          <span class="badge badge-neutral">${labelsData?.total || 0}</span>
        </div>
        ${labels.length === 0
          ? `<div class="empty-state" style="padding:1.5rem">
              <div class="empty-state-title">Sin etiquetas</div>
              <div class="empty-state-desc">Genera la primera etiqueta para este producto</div>
            </div>`
          : `<div class="flex flex-col gap-2">${labels.map(l => `
              <div style="display:flex;align-items:center;gap:0.75rem;padding:0.75rem;background:var(--bg);border-radius:var(--radius-sm)">
                <div style="flex:1">
                  <div style="font-weight:600;font-size:0.85rem">
                    ${l.language.toUpperCase()} — ${l.format.toUpperCase()}
                  </div>
                  <div class="text-xs text-muted">${fmtDatetime(l.generated_at)}${l.regulation_version ? ' &bull; Reg. ' + l.regulation_version : ''}</div>
                </div>
                <a href="${ROOT}/labels/${l.id}" class="btn btn-ghost btn-sm">Ver</a>
              </div>`).join('')}
            </div>`}
      </div>`;
  }

  async function checkOffersAsync(barcode) {
    try {
      const result = await api.get('/api/v1/integrations/offers?barcode=' + encodeURIComponent(barcode));
      if (result && result.has_offers && result.url) {
        const wrap = document.getElementById('offer-btn-wrap');
        if (wrap) {
          wrap.innerHTML = `<a href="${escHtml(result.url)}" target="_blank" rel="noopener noreferrer" class="btn btn-accent btn-sm">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20.59 13.41l-7.17 7.17a2 2 0 01-2.83 0L2 12V2h10l8.59 8.59a2 2 0 010 2.82z"/><circle cx="7" cy="7" r="1.5" fill="currentColor"/></svg>
            Ver oferta
          </a>`;
          wrap.style.display = 'block';
        }
      }
    } catch(e) { /* fail silently — api_offer may be down */ }
  }

  async function showGenerateModal(product) {
    const lang = confirm('\u00bfGenerar en espanol? (Cancelar para ingles)') ? 'es' : 'en';
    const format = confirm('\u00bfGenerar en formato HTML? (Cancelar para PDF)') ? 'html' : 'pdf';
    try {
      Toast.info('Generando etiqueta...');
      const label = await api.post('/api/v1/labels/generate', {
        product_id: product.id,
        format,
        language: lang,
      });
      Toast.success('Etiqueta generada');
      window.location.href = ROOT + '/labels/' + label.id;
    } catch(e) {
      Toast.error(e.message || 'Error generando etiqueta');
    }
  }

  loadProduct();
})();
</script>

<style>
  .page-header-row {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-bottom: 1.25rem;
  }
  .page-header-title {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* 2-column layout: info + regulatory side by side */
  .product-main-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
    margin-bottom: 1rem;
    align-items: stretch;
  }
  .product-main-grid > .card {
    height: 100%;
    box-sizing: border-box;
  }
  @media (max-width: 768px) {
    .product-main-grid { grid-template-columns: 1fr; }
  }

  /* Info card fields */
  .detail-fields {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 0.4rem;
    margin-top: 0.25rem;
  }
  .detail-field {
    display: flex;
    flex-direction: column;
    gap: 0.1rem;
  }
  .detail-label {
    font-size: 0.68rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-muted);
  }
  .detail-value {
    font-size: 0.85rem;
    font-weight: 500;
    color: var(--text);
    word-break: break-word;
  }

  /* Compact regulatory data list */
  .reg-data-list {
    display: flex;
    flex-direction: column;
    max-height: 260px;
    overflow-y: auto;
  }
  .reg-row {
    display: flex;
    align-items: baseline;
    gap: 0.5rem;
    padding: 0.28rem 0;
    border-bottom: 1px solid var(--border);
  }
  .reg-row:last-child { border-bottom: none; }
  .reg-row .detail-label {
    flex: 0 0 auto;
    width: 140px;
    text-transform: none;
    letter-spacing: 0;
    font-size: 0.75rem;
  }
  .reg-val {
    flex: 1;
    font-size: 0.82rem;
    font-weight: 400;
  }

  /* Barcode at bottom of info card */
  .barcode-wrap {
    margin-top: 1rem;
    padding-top: 0.75rem;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: center;
  }
  .barcode-wrap svg {
    max-width: 100%;
    height: auto;
  }
</style>
{% endblock %}
