{% extends "base.html" %}
{% block title %}Gestión de usuarios{% endblock %}
{% set active_page = "admin_users" %}

{% block content %}
<div class="desktop-page-header flex items-center justify-between">
  <h1>Gestión de usuarios</h1>
</div>
<h2 style="font-size:1.1rem;font-family:var(--font-head);margin-bottom:1rem;padding-top:0.25rem">Usuarios</h2>

<div class="search-bar">
  <div class="search-input-wrap">
    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="search" id="search-input" class="form-control" placeholder="Buscar usuario...">
  </div>
</div>

<div id="users-container" class="table-wrapper">
  <div class="loading-overlay">
    <div class="spinner"></div>
    <span>Cargando usuarios...</span>
  </div>
</div>
<div id="pagination" class="pagination"></div>

{# User detail modal #}
<div class="modal-backdrop" id="modal-user" role="dialog" aria-modal="true">
  <div class="modal">
    <div class="modal-header">
      <h2 class="modal-title">Detalle de usuario</h2>
      <button class="btn-menu" data-modal-close aria-label="Cerrar">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="modal-body" id="modal-user-body">
      <div class="loading-overlay"><div class="spinner"></div></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" data-modal-close>Cerrar</button>
      <button class="btn btn-primary" id="btn-toggle-active">Activar/Desactivar</button>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
(function() {
  if (!Auth.requireAdmin()) return;

  let currentPage = 1;
  let selectedUserId = null;
  let selectedUser = null;
  let searchTimeout = null;

  const container   = document.getElementById('users-container');
  const pagination  = document.getElementById('pagination');
  const searchInput = document.getElementById('search-input');

  async function loadUsers(page = 1) {
    container.innerHTML = `<div class="loading-overlay"><div class="spinner"></div><span>Cargando...</span></div>`;
    try {
      const data = await api.get(`/api/v1/users?page=${page}&page_size=20`);
      if (!data || data.items.length === 0) {
        container.innerHTML = `<div class="empty-state"><div class="empty-state-title">Sin usuarios</div></div>`;
        return;
      }

      let items = data.items;
      const search = searchInput.value.trim().toLowerCase();
      if (search) {
        items = items.filter(u =>
          (u.username || '').toLowerCase().includes(search) ||
          (u.email || '').toLowerCase().includes(search) ||
          (u.full_name || '').toLowerCase().includes(search)
        );
      }

      container.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>Usuario</th>
              <th>Email</th>
              <th>Rol</th>
              <th>Estado</th>
              <th>Registrado</th>
              <th></th>
            </tr>
          </thead>
          <tbody>${items.map(u => `
            <tr>
              <td>
                <div style="font-weight:600;font-size:0.875rem">${u.full_name || u.username}</div>
                <div class="td-muted">@${u.username}</div>
              </td>
              <td class="text-sm">${u.email || '—'}</td>
              <td>
                <span class="badge ${u.is_admin ? 'badge-primary' : 'badge-neutral'}">
                  ${u.is_admin ? 'Admin' : 'Usuario'}
                </span>
              </td>
              <td>
                <span class="badge ${u.is_active ? 'badge-success' : 'badge-error'}">
                  ${u.is_active ? 'Activo' : 'Inactivo'}
                </span>
              </td>
              <td class="td-muted">${fmtDate(u.created_at)}</td>
              <td>
                <button class="btn btn-ghost btn-icon btn-sm" onclick="showUserDetail('${u.id}')" title="Ver detalle">
                  <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
              </td>
            </tr>`).join('')}
          </tbody>
        </table>`;

      renderPagination(pagination, { page: data.page, pages: data.pages }, (p) => {
        currentPage = p;
        loadUsers(p);
      });
    } catch(e) {
      container.innerHTML = `<div class="alert alert-error p-4">${e.message || 'Error cargando usuarios'}</div>`;
    }
  }

  window.showUserDetail = async function(userId) {
    selectedUserId = userId;
    document.getElementById('modal-user-body').innerHTML = `<div class="loading-overlay"><div class="spinner"></div></div>`;
    Modal.open('modal-user');

    try {
      const user = await api.get(`/api/v1/users/${userId}`);
      selectedUser = user;

      document.getElementById('modal-user-body').innerHTML = `
        <div class="flex items-center gap-3 mb-4">
          <div style="width:52px;height:52px;border-radius:50%;background:var(--primary);display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--font-head);font-weight:700;font-size:1.2rem;flex-shrink:0">
            ${(user.full_name || user.username || 'U').charAt(0).toUpperCase()}
          </div>
          <div>
            <div style="font-weight:700;font-size:1rem">${user.full_name || user.username}</div>
            <div class="text-sm text-muted">@${user.username}</div>
          </div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.75rem;font-size:0.875rem">
          <div><div class="text-xs text-muted mb-1">Email</div><div>${user.email || '—'}</div></div>
          <div><div class="text-xs text-muted mb-1">Rol</div><div>${user.is_admin ? 'Administrador' : 'Usuario'}</div></div>
          <div><div class="text-xs text-muted mb-1">Estado</div>
            <span class="badge ${user.is_active ? 'badge-success' : 'badge-error'}">${user.is_active ? 'Activo' : 'Inactivo'}</span>
          </div>
          <div><div class="text-xs text-muted mb-1">Registrado</div><div>${fmtDatetime(user.created_at)}</div></div>
          <div style="grid-column:1/-1"><div class="text-xs text-muted mb-1">ID</div><div class="mono" style="font-size:0.75rem;word-break:break-all">${user.id}</div></div>
        </div>`;

      const btnToggle = document.getElementById('btn-toggle-active');
      btnToggle.textContent = user.is_active ? 'Desactivar cuenta' : 'Activar cuenta';
      btnToggle.className = `btn ${user.is_active ? 'btn-danger' : 'btn-primary'}`;
    } catch(e) {
      document.getElementById('modal-user-body').innerHTML = `<div class="alert alert-error">${e.message}</div>`;
    }
  };

  document.getElementById('btn-toggle-active').addEventListener('click', async () => {
    if (!selectedUser || !selectedUserId) return;
    try {
      const newActive = !selectedUser.is_active;
      await api.put(`/api/v1/users/${selectedUserId}`, {
        is_active: newActive,
      });
      Toast.success(newActive ? 'Cuenta activada' : 'Cuenta desactivada');
      Modal.close('modal-user');
      loadUsers(currentPage);
    } catch(e) {
      Toast.error(e.message || 'Error al actualizar usuario');
    }
  });

  searchInput.addEventListener('input', () => {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(() => { currentPage = 1; loadUsers(1); }, 350);
  });

  loadUsers(1);
})();
</script>
{% endblock %}
