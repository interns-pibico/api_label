{% extends "base.html" %}
{% block title %}Iniciar sesión{% endblock %}

{% block body %}
<nav class="pub-nav">
  <div class="pub-nav-inner">
    <a href="{{ root_path }}/" class="pub-nav-logo">
      <div style="width:32px;height:32px;background:var(--primary);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--font-head);font-weight:700;font-size:1rem">L</div>
      <span>Label Studio</span>
    </a>
    <div class="pub-nav-actions">
      <a href="{{ root_path }}/#precios" class="btn btn-primary btn-sm">Suscribirse</a>
    </div>
  </div>
</nav>
<div class="auth-page auth-with-nav">
  <div class="auth-card">
    <div class="flex items-center gap-3 mb-6">
      <div style="width:44px;height:44px;background:var(--primary);border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--font-head);font-weight:700;font-size:1.3rem">L</div>
      <div>
        <div style="font-family:var(--font-head);font-weight:700;font-size:1.2rem;color:var(--primary)">Label Studio</div>
        <div style="font-size:0.75rem;color:var(--text-muted)">Sistema de etiquetas de producto</div>
      </div>
    </div>

    <h1 style="font-size:1.4rem;margin-bottom:0.25rem">Iniciar sesión</h1>
    <p class="text-muted text-sm mb-4">Accede a tu cuenta para continuar</p>

    <div id="error-msg" class="alert alert-error hidden" role="alert"></div>

    <form id="login-form" novalidate>
      <div class="form-group">
        <label class="form-label" for="username">Usuario</label>
        <input id="username" name="username" type="text" class="form-control"
               placeholder="Tu nombre de usuario" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Contraseña</label>
        <div style="position:relative">
          <input id="password" name="password" type="password" class="form-control"
                 placeholder="Tu contraseña" autocomplete="current-password" required
                 style="padding-right:2.75rem">
          <button type="button" id="toggle-pw" aria-label="Mostrar/ocultar contraseña"
                  style="position:absolute;right:0.75rem;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text-muted);padding:0.25rem;display:flex;align-items:center">
            <svg id="eye-icon" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-lg" id="submit-btn">
        <span id="submit-text">Entrar</span>
        <span id="submit-spinner" class="spinner hidden" style="width:18px;height:18px;border-width:2px"></span>
      </button>
    </form>

    <p class="text-sm text-muted mt-4" style="text-align:center">
      ¿No tienes cuenta?
      <a href="{{ root_path }}/register" style="color:var(--primary);font-weight:600">Regístrate</a>
    </p>
  </div>
</div>

{% endblock %}

{% block scripts %}
<script>
(function() {
  // Redirect if already logged in
  if (Auth.isLoggedIn()) {
    window.location.href = ROOT + '/dashboard';
    return;
  }

  const form    = document.getElementById('login-form');
  const errMsg  = document.getElementById('error-msg');
  const spinner = document.getElementById('submit-spinner');
  const btnText = document.getElementById('submit-text');
  const btn     = document.getElementById('submit-btn');

  // Password toggle
  document.getElementById('toggle-pw').addEventListener('click', function() {
    const pw = document.getElementById('password');
    pw.type = pw.type === 'password' ? 'text' : 'password';
  });

  function setLoading(on) {
    btn.disabled = on;
    spinner.classList.toggle('hidden', !on);
    btnText.textContent = on ? 'Entrando...' : 'Entrar';
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errMsg.classList.add('hidden');
    errMsg.textContent = '';

    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    if (!username || !password) {
      errMsg.textContent = 'Por favor completa todos los campos.';
      errMsg.classList.remove('hidden');
      return;
    }

    setLoading(true);
    try {
      // Login uses form-encoded (OAuth2PasswordRequestForm)
      const formData = new URLSearchParams();
      formData.append('username', username);
      formData.append('password', password);

      const res = await fetch(ROOT + '/api/v1/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: formData.toString(),
      });
      const data = await res.json();

      if (!res.ok) {
        throw new Error(data.detail || 'Credenciales incorrectas');
      }

      Auth.setToken(data.access_token);

      // Fetch user profile
      const user = await api.get('/api/v1/auth/me');
      if (user) Auth.setUser(user);

      window.location.href = ROOT + '/dashboard';
    } catch (err) {
      errMsg.textContent = err.message || 'Error al iniciar sesión';
      errMsg.classList.remove('hidden');
      setLoading(false);
    }
  });
})();
</script>
{% endblock %}
